<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Web Player</title>
  <link rel="stylesheet" href="player-shaka.bundle.css">
  <link rel="stylesheet" href="player-common.css">
</head>
<body>
  <div id="error-message" role="alert"></div>
  <!-- Shaka UI (touch-friendly controls, double-tap seek, menus) is built on this container -->
  <div id="player-container">
    <video id="video" playsinline></video>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="player-shaka.bundle.js"></script>
</body>
</html>
