<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Player — Shaka</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff5252;
      font-size: 16px;
      padding: 24px;
      text-align: center;
      z-index: 20;
    }
    #video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    /* ── Controls overlay ───────────────────────────────────── */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 10;
      pointer-events: none;
    }
    #controls.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ── Buttons ─────────────────────────────────────────────── */
    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.18); }
    .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* ── Progress bar ────────────────────────────────────────── */
    #progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    #progress {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      outline: none;
      cursor: pointer;
      accent-color: #4fc3f7;
      transition: height 0.15s;
    }
    #progress:hover { height: 6px; }
    #progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #4fc3f7;
      cursor: pointer;
    }

    /* ── Volume slider ───────────────────────────────────────── */
    #volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 72px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      outline: none;
      cursor: pointer;
      accent-color: #4fc3f7;
      flex-shrink: 0;
    }
    #volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4fc3f7;
      cursor: pointer;
    }

    /* ── Time display ────────────────────────────────────────── */
    #time {
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Engine badge ────────────────────────────────────────── */
    #engine-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.5);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 11;
    }
  </style>
</head>
<body>
  <div id="error-message"></div>
  <video id="video" playsinline crossorigin="anonymous"></video>

  <div id="controls">
    <!-- Play/Pause -->
    <button class="ctrl-btn" id="btn-play" title="Play / Pause (Space)">
      <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <!-- Rewind 10s -->
    <button class="ctrl-btn" id="btn-back" title="Rewind 10s (←)">
      <svg viewBox="0 0 24 24">
        <path d="M12.5 3a9 9 0 1 0 7.94 4.77L18.6 9.1A7 7 0 1 1 12.5 5V3z"/>
        <path d="M11.5 3l-3 3 3 3V3z"/>
        <text x="8" y="15.5" font-size="5.5" fill="white" font-family="sans-serif">10</text>
      </svg>
    </button>

    <!-- Progress bar -->
    <div id="progress-wrap">
      <input type="range" id="progress" min="0" max="100" step="0.1" value="0">
    </div>

    <!-- Time -->
    <span id="time">0:00</span>

    <!-- Mute -->
    <button class="ctrl-btn" id="btn-mute" title="Mute (M)">
      <svg id="icon-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77 0-4.28-2.99-7.86-7-8.77z"/></svg>
      <svg id="icon-mute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 19l2 2L21 19.73l-18-18zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>

    <!-- Volume -->
    <input type="range" id="volume-slider" min="0" max="1" step="0.02" value="1" title="Volume (↑↓)">

    <!-- Forward 10s -->
    <button class="ctrl-btn" id="btn-fwd" title="Forward 10s (→)">
      <svg viewBox="0 0 24 24">
        <path d="M11.5 3a9 9 0 1 1-7.94 4.77L5.4 9.1A7 7 0 1 0 11.5 5V3z"/>
        <path d="M12.5 3l3 3-3 3V3z"/>
        <text x="8" y="15.5" font-size="5.5" fill="white" font-family="sans-serif">10</text>
      </svg>
    </button>

    <!-- Fullscreen -->
    <button class="ctrl-btn" id="btn-fs" title="Fullscreen (F)">
      <svg id="icon-fs-on" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <svg id="icon-fs-off" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    </button>
  </div>

  <div id="engine-badge">Shaka Player</div>

  <!-- Shaka init bundle (sets up player, attaches to video element) -->
  <script type="module" src="player-shaka.bundle.js"></script>
  <!-- Controls (deferred so video element exists; no inline code = CSP safe) -->
  <script src="player-shaka-controls.js" defer></script>
</body>
</html>
